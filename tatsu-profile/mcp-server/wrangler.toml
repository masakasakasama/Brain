name = "tatsu-profile-mcp"
main = "src/index.ts"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Set the parent page ID of the "Tatsu Profile" Notion page.
[vars]
PARENT_PAGE_ID = "36329082-7880-811d-91b6-ca4d9b057b1d"

# Secrets (NOTION_TOKEN, AUTH_SECRET) are NOT stored here.
# Set them with:  wrangler secret put NOTION_TOKEN
#                  wrangler secret put AUTH_SECRET

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "TatsuMCP" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TatsuMCP"]
